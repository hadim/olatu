name: Refresh data (buoys · tides · wind → HF bucket)

# Every 30 min, for EACH buoy, refresh ALL three data sources and upload them back to
# buckets/hadim/olatu:
#   • buoys — pull the realtime accumulator, scrape the live CANDHIS feed, rebuild tiers
#   • tides — refresh the nearest port's extrema from api-maree.fr        (spec 0008)
#   • wind  — scrape the nearest station's 6-min feed from Météo-France + rebuild (specs 0012/0013)
# The webapp reads those tiers at runtime, so this NEVER rebuilds or redeploys the site —
# it is a tiny Python-only job. See specs/0004 §6, 0005 §4, 0008, 0012.
#
# Auth: the HF_TOKEN secret (a fine-grained HF token, "olatu-gh-ci", scoped read+write to
# the bucket hadim/olatu) when it is set — ingest/update.resolve_token takes it before
# anything else. When the secret is ABSENT the job falls back to keyless OIDC Trusted
# Publishers: the trusted publisher is configured on the bucket hadim/olatu → Settings →
# Trusted Publishers with claims repository = hadim/olatu and workflow_ref starts-with
# hadim/olatu/.github/workflows/refresh-data.yml@. The secret was added on 2026-09-02
# because HF's OIDC exchange kept failing on their side (400 "operation was aborted",
# 429s) and took the whole cron down with it; delete the secret to go back to OIDC —
# nothing else needs to change (permissions.id-token stays on for that reason).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      keyless:
        description: 'Ignore the HF_TOKEN secret for this run and authenticate via OIDC (tests the trusted publisher without deleting the secret)'
        type: boolean
        default: false

permissions:
  id-token: write # OIDC fallback: mint the id_token exchanged for a bucket-scoped HF token when HF_TOKEN is unset
  contents: read

# Never let two refreshes race the bucket.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A refresh takes ~20-60s. Cap it well above that but far below the 6h default: when HF
    # stalls mid-read, the job would otherwise hang for hours AND — because the concurrency
    # group above never cancels in progress — queue every subsequent cron behind it, so one
    # outage silently stops the data pipeline entirely. Bounded here and, more precisely,
    # per network step by ingest/ui.py's watchdog (which dumps stacks before it dies).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reproduces the local env exactly from pixi.lock (cached between runs). Install
      # only the lean `data` environment (no Node/ruff) — that's all the refresh needs.
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
          environments: data

      - name: Cache the immutable archives (so we don't re-download them each run)
        uses: actions/cache@v6
        with:
          path: |
            hfdata/06403/raw
            hfdata/06402/raw
            hfdata/03302/raw
          key: candhis-raw-v1

      # All buoys in one job: one checkout, one env, and crucially ONE OIDC token
      # exchange shared across campaigns (avoids the per-buoy 429s). update.py refreshes
      # each buoy independently and exits non-zero if any failed (fail-fast off).
      #
      # Ingest-only secrets, NEVER shipped to the webapp — only derived tiers are uploaded
      # to the bucket:
      #   HF_TOKEN             bucket read/write (see the auth note at the top); unset → OIDC
      #   API_MAREE_KEY        tide refresh (ingest/tides.py, spec 0008) -> tides/<port>/
      #   METEOFRANCE_API_KEY  6-min live wind (ingest/wind.py DPObs, spec 0012) -> wind/<station>/
      # The last two are non-fatal if unset (the step logs + skips).
      # The hourly wind history needs no key (open Météo-France bulk files) and refreshes at
      # most ~once/day (gated in update._hourly_wind_due). Each buoy resolves to its nearest
      # port/station; the 3 buoys map to 3 distinct ones, so one run refreshes all with no
      # collision.
      - name: Refresh every buoy (pull → scrape → tides → wind → build → upload to HF)
        env:
          # Blank on a `keyless` dispatch so resolve_token falls through to the OIDC exchange.
          # Written this way round on purpose: `inputs.keyless && '' || secrets.HF_TOKEN` looks
          # equivalent but is not -- '' is FALSY in a GHA expression, so the `||` branch would
          # win and hand the secret back. On `schedule`, inputs.keyless is null -> secret.
          HF_TOKEN: ${{ inputs.keyless != true && secrets.HF_TOKEN || '' }}
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: pixi run -e data update -c 06403 -c 06402 -c 03302
