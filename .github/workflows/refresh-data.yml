name: Refresh data (CANDHIS → HF bucket)

# Every 30 min, for EACH buoy: pull the realtime accumulator from the HF bucket, scrape
# the live CANDHIS feed, rebuild the tiers, and upload them back to buckets/hadim/olatu.
# The webapp reads those tiers at runtime, so this NEVER rebuilds or redeploys the site —
# it is a tiny Python-only job. See specs/0004 §6 and 0005 §4.
#
# Auth is keyless via OIDC Trusted Publishers (no HF_TOKEN secret): the trusted publisher
# is configured on the bucket hadim/olatu → Settings → Trusted Publishers with claims
# repository = hadim/olatu  and  workflow_ref starts-with hadim/olatu/.github/workflows/refresh-data.yml@.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token exchanged for a short-lived, bucket-scoped HF token
  contents: read

# Never let two refreshes race the bucket.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A refresh takes ~20-60s. Cap it well above that but far below the 6h default: when HF
    # stalls mid-read, the job would otherwise hang for hours AND — because the concurrency
    # group above never cancels in progress — queue every subsequent cron behind it, so one
    # outage silently stops the data pipeline entirely. Bounded here and, more precisely,
    # per network step by ingest/ui.py's watchdog (which dumps stacks before it dies).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reproduces the local env exactly from pixi.lock (cached between runs). Install
      # only the lean `data` environment (no Node/ruff) — that's all the refresh needs.
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
          environments: data

      - name: Cache the immutable archives (so we don't re-download them each run)
        uses: actions/cache@v6
        with:
          path: |
            hfdata/06403/raw
            hfdata/06402/raw
            hfdata/03302/raw
          key: candhis-raw-v1

      # All buoys in one job: one checkout, one env, and crucially ONE OIDC token
      # exchange shared across campaigns (avoids the per-buoy 429s). update.py refreshes
      # each buoy independently and exits non-zero if any failed (fail-fast off).
      #
      # Ingest-only secrets, both non-fatal if unset (the step logs + skips) and NEVER shipped
      # to the webapp — only derived tiers are uploaded to the bucket:
      #   API_MAREE_KEY        tide refresh (ingest/tides.py, spec 0008) -> tides/<port>/
      #   METEOFRANCE_API_KEY  6-min live wind (ingest/wind.py DPObs, spec 0012) -> wind/<station>/
      # The hourly wind history needs no key (open Météo-France bulk files) and refreshes at
      # most ~once/day (gated in update._hourly_wind_due). Each buoy resolves to its nearest
      # port/station; the 3 buoys map to 3 distinct ones, so one run refreshes all with no
      # collision.
      - name: Refresh every buoy (pull → scrape → tides → wind → build → upload to HF)
        env:
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: pixi run -e data update -c 06403 -c 06402 -c 03302
